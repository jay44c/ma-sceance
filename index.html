<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Séance Élastique</title>
<style>
  :root{
    --bg: #1c1e22;
    --panel: #24272c;
    --panel-2: #2c3036;
    --line: #383c42;
    --text: #eef0f2;
    --text-dim: #9aa0a8;
    --band: #e8935a;
    --band-dim: #7a5236;
    --teal: #5cb8ab;
    --danger: #d9695f;
    --radius: 14px;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body{ padding-bottom: 40px; }

  header{ padding: 22px 18px 14px; }
  .eyebrow{ font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--band); font-weight: 700; margin-bottom: 4px; }
  h1{ font-size: 22px; margin: 0 0 4px; font-weight: 800; letter-spacing: -0.01em; }
  .sub{ color: var(--text-dim); font-size: 13px; }

  .wrap{ max-width: 560px; margin: 0 auto; padding: 0 14px; }

  .progress-row{ display:flex; align-items:center; gap:10px; margin: 14px 0 18px; }
  .progress-track{ flex:1; height: 6px; border-radius: 4px; background: var(--panel-2); overflow:hidden; }
  .progress-fill{ height:100%; background: linear-gradient(90deg, var(--band-dim), var(--band)); width:0%;
    transition: width .35s ease; }
  .progress-label{ font-size: 12px; color: var(--text-dim); white-space:nowrap; font-variant-numeric: tabular-nums; }

  .exo-card{ background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 14px 12px; margin-bottom: 12px; transition: border-color .2s, opacity .2s; }
  .exo-card.done{ opacity: .55; }
  .exo-card.active{ border-color: var(--band); box-shadow: 0 0 0 1px var(--band) inset; }

  .exo-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .exo-name{ font-size: 15.5px; font-weight: 700; margin:0; }
  .exo-name[contenteditable="true"]{ outline: none; border-bottom: 1px dashed transparent; }
  .exo-name[contenteditable="true"]:focus{ border-bottom-color: var(--band); }
  .exo-meta{ color: var(--text-dim); font-size: 12.5px; margin-top: 3px; }

  .del-btn{ background:none; border:none; color: var(--text-dim); font-size: 18px; cursor:pointer;
    line-height:1; padding: 2px 4px; }
  .del-btn:hover{ color: var(--danger); }

  .set-row{ display:flex; align-items:center; gap:10px; margin-top: 12px; }
  .set-pill{ display:flex; gap:6px; flex-wrap: wrap; flex:1; }
  .set-dot{ width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line);
    background: var(--panel-2); color: var(--text-dim); font-size: 12px; font-weight: 700;
    display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none;
    transition: all .15s; }
  .set-dot.checked{ background: var(--band); border-color: var(--band); color: #1c1e22; }

  .params{ display:flex; gap: 14px; margin-top: 10px; }
  .param{ flex:1; }
  .param label{ display:block; font-size: 10.5px; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: .06em; margin-bottom: 4px; }
  .param input{ width:100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); font-size: 14px; padding: 7px 8px; font-variant-numeric: tabular-nums; }
  .param input:focus{ outline: none; border-color: var(--band); }

  .start-rest{ margin-top: 12px; width: 100%; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--text); border-radius: 10px; padding: 10px; font-size: 13.5px; font-weight: 600;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .start-rest:active{ transform: scale(0.98); }
  .start-rest.disabled{ opacity: .35; pointer-events:none; }

  .add-btn{ width:100%; padding: 13px; border-radius: var(--radius); border: 1.5px dashed var(--line);
    background: transparent; color: var(--text-dim); font-size: 14px; font-weight: 600; cursor:pointer;
    margin-top: 4px; margin-bottom: 20px; }
  .add-btn:active{ background: var(--panel); }

  /* Overlay timer */
  .overlay{ position: fixed; inset:0; background: rgba(20,21,24,0.94); backdrop-filter: blur(6px);
    display:none; flex-direction:column; align-items:center; justify-content:center; z-index: 50; padding: 20px; }
  .overlay.show{ display:flex; }
  .overlay-label{ color: var(--text-dim); font-size: 13px; text-transform: uppercase; letter-spacing: .12em;
    margin-bottom: 6px; font-weight: 700; }
  .overlay-exo{ color: var(--text); font-size: 17px; margin-bottom: 22px; font-weight: 600; text-align:center; }
  .ring-wrap{ position: relative; width: 220px; height: 220px; }
  svg.ring{ transform: rotate(-90deg); width:100%; height:100%; }
  .ring-bg{ fill:none; stroke: var(--panel-2); stroke-width: 10; }
  .ring-fg{ fill:none; stroke: var(--band); stroke-width: 10; stroke-linecap: round;
    transition: stroke-dashoffset 1s linear; }
  .ring-time{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size: 52px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .overlay-btns{ display:flex; gap: 12px; margin-top: 30px; }
  .ov-btn{ padding: 12px 22px; border-radius: 30px; font-size: 14px; font-weight: 700; border:none; cursor:pointer; }
  .ov-btn.skip{ background: var(--panel-2); color: var(--text); }
  .ov-btn.add{ background: transparent; color: var(--band); border: 1.5px solid var(--band-dim); }

  .done-banner{ text-align:center; padding: 30px 16px; color: var(--teal); font-weight: 700; font-size: 15px; }
  .reset-link{ display:block; text-align:center; margin-top: 10px; color: var(--text-dim); font-size: 12.5px;
    text-decoration: underline; cursor:pointer; }

  .video-row{ display:flex; align-items:center; gap:8px; margin-top: 10px; }
  .video-row input{ flex:1; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); font-size: 12.5px; padding: 7px 9px; }
  .video-row input:focus{ outline: none; border-color: var(--band); }
  .video-row input::placeholder{ color: var(--text-dim); }
  .video-link{ display:flex; align-items:center; gap: 5px; background: var(--band-dim); color: var(--text);
    border: none; border-radius: 8px; padding: 7px 10px; font-size: 12.5px; font-weight: 700;
    text-decoration:none; white-space:nowrap; flex-shrink:0; }
  .video-link:active{ opacity: .8; }

  .save-indicator{ font-size: 11px; color: var(--text-dim); display:flex; align-items:center; gap:5px; flex-wrap: wrap; }
  .save-dot{ width:6px; height:6px; border-radius:50%; background: var(--teal); }
  .wake-dot{ width:6px; height:6px; border-radius:50%; background: var(--line); }
  .wake-dot.active{ background: var(--band); }
  .wake-sep{ color: var(--line); margin: 0 2px; }

  .toolbar{ display:flex; gap: 10px; margin: 12px 0 4px; }
  .tool-btn{ flex:1; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 11px 8px; font-size: 13px; font-weight: 700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px; }
  .tool-btn:active{ transform: scale(0.98); }
  .tool-btn.timer{ color: var(--band); border-color: var(--band-dim); }

  /* Free timer overlay */
  .timer-setup{ display:flex; gap: 14px; margin-bottom: 22px; }
  .timer-setup .param input{ text-align:center; font-size: 18px; padding: 10px 8px; }
  .timer-quick{ display:flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; justify-content:center; }
  .quick-chip{ background: var(--panel-2); border: 1px solid var(--line); color: var(--text-dim);
    border-radius: 20px; padding: 7px 14px; font-size: 12.5px; font-weight: 600; cursor:pointer; }
  .quick-chip:active{ background: var(--band-dim); color: var(--text); }
  .ov-btn.primary{ background: var(--band); color: #1c1e22; }
  .ov-btn.close-x{ position:absolute; top:20px; right:20px; background:none; color: var(--text-dim);
    font-size: 26px; border:none; padding: 4px 10px; }
</style>
</head>
<body>

<header class="wrap">
  <div class="eyebrow">Haut du corps · Débutant</div>
  <h1>Ma séance élastique</h1>
  <div class="sub">Touche un rond pour valider une série. Le repos se lance automatiquement.</div>
</header>

<div class="wrap">
  <div class="toolbar">
    <button class="tool-btn timer" id="freeTimerBtn">⏲ Décompte libre</button>
    <button class="tool-btn" id="clearProgressBtn">↺ Réinitialiser les séries</button>
  </div>

  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 0 séries</div>
  </div>
  <div class="save-indicator" id="saveIndicator" style="margin-bottom:10px;">
    <span class="save-dot"></span> Sauvegardé automatiquement sur cet appareil
    <span class="wake-sep">·</span>
    <span class="wake-dot" id="wakeDot"></span> <span id="wakeLabel">Écran : veille normale</span>
  </div>

  <div id="exoList"></div>

  <button class="add-btn" id="addExoBtn">+ Ajouter un exercice</button>
  <div id="doneBanner"></div>
</div>

<!-- Overlay repos -->
<div class="overlay" id="restOverlay">
  <div class="overlay-label">Repos</div>
  <div class="overlay-exo" id="restExoName"></div>
  <div class="ring-wrap">
    <svg class="ring" viewBox="0 0 220 220">
      <circle class="ring-bg" cx="110" cy="110" r="100"></circle>
      <circle class="ring-fg" id="ringFg" cx="110" cy="110" r="100"
        stroke-dasharray="628" stroke-dashoffset="0"></circle>
    </svg>
    <div class="ring-time" id="ringTime">00:00</div>
  </div>
  <div class="overlay-btns">
    <button class="ov-btn add" id="addTimeBtn">+15 sec</button>
    <button class="ov-btn skip" id="skipRestBtn">Passer</button>
  </div>
</div>

<!-- Overlay décompte libre -->
<div class="overlay" id="freeOverlay" style="position:fixed;">
  <button class="ov-btn-close ov-btn.close-x" id="closeFreeSetup" style="position:absolute; top:20px; right:20px; background:none; color:var(--text-dim); font-size:26px; border:none; padding:4px 10px; cursor:pointer;">&times;</button>
  <div id="freeSetupView">
    <div class="overlay-label">Décompte libre</div>
    <div class="overlay-exo">Choisis une durée</div>
    <div class="timer-quick">
      <div class="quick-chip" data-sec="30">30 sec</div>
      <div class="quick-chip" data-sec="60">1 min</div>
      <div class="quick-chip" data-sec="90">1 min 30</div>
      <div class="quick-chip" data-sec="120">2 min</div>
      <div class="quick-chip" data-sec="180">3 min</div>
    </div>
    <div class="timer-setup">
      <div class="param" style="width:100px;"><label>Minutes</label><input type="number" id="freeMin" value="1" min="0"></div>
      <div class="param" style="width:100px;"><label>Secondes</label><input type="number" id="freeSec" value="0" min="0" max="59"></div>
    </div>
    <div class="overlay-btns">
      <button class="ov-btn primary" id="startFreeBtn">Démarrer</button>
    </div>
  </div>
  <div id="freeRunView" style="display:none; flex-direction:column; align-items:center;">
    <div class="overlay-label">Décompte</div>
    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 220 220">
        <circle class="ring-bg" cx="110" cy="110" r="100"></circle>
        <circle class="ring-fg" id="freeRingFg" cx="110" cy="110" r="100"
          stroke-dasharray="628" stroke-dashoffset="0"></circle>
      </svg>
      <div class="ring-time" id="freeRingTime">00:00</div>
    </div>
    <div class="overlay-btns">
      <button class="ov-btn add" id="freePauseBtn">Pause</button>
      <button class="ov-btn skip" id="freeStopBtn">Arrêter</button>
    </div>
  </div>
</div>

<script>
(function(){
  const defaultExercises = [
    { name: "Face pull (dos / épaules arrière)", sets: 3, reps: 14, rest: 50, checked: [], video: "" },
    { name: "Développé pectoral (chest press)", sets: 3, reps: 14, rest: 50, checked: [], video: "" },
    { name: "Élévations latérales (épaules)", sets: 3, reps: 14, rest: 50, checked: [], video: "" },
    { name: "Curl biceps", sets: 3, reps: 14, rest: 45, checked: [], video: "" },
    { name: "Extension triceps", sets: 3, reps: 14, rest: 45, checked: [], video: "" },
    { name: "Rowing debout (supination)", sets: 3, reps: 14, rest: 50, checked: [], video: "" },
    { name: "Développé militaire (assis)", sets: 3, reps: 12, rest: 60, checked: [], video: "" },
  ];

  const STORAGE_KEY = 'seance-elastique-data-v1';

  function loadSaved(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return JSON.parse(JSON.stringify(defaultExercises));
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length) {
        // compatibilité avec les sauvegardes créées avant l'ajout du champ vidéo
        parsed.forEach(e => { if (typeof e.video === 'undefined') e.video = ''; });
        return parsed;
      }
      return JSON.parse(JSON.stringify(defaultExercises));
    }catch(e){
      return JSON.parse(JSON.stringify(defaultExercises));
    }
  }

  function saveExercises(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(exercises)); }catch(e){ /* stockage indisponible */ }
  }

  let exercises = loadSaved();
  let timerInterval = null;
  let timeLeft = 0;
  let totalTime = 0;
  let activeExoIndex = null;

  const exoList = document.getElementById('exoList');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const doneBanner = document.getElementById('doneBanner');
  const overlay = document.getElementById('restOverlay');
  const restExoName = document.getElementById('restExoName');
  const ringFg = document.getElementById('ringFg');
  const ringTime = document.getElementById('ringTime');
  const CIRCUMFERENCE = 628;

  function totalSets(){
    return exercises.reduce((a,e)=>a+e.sets,0);
  }
  function doneSets(){
    return exercises.reduce((a,e)=>a+e.checked.filter(Boolean).length,0);
  }

  function render(){
    saveExercises();
    exoList.innerHTML = '';
    exercises.forEach((exo, i) => {
      const allDone = exo.checked.filter(Boolean).length === exo.sets && exo.sets > 0;
      const card = document.createElement('div');
      card.className = 'exo-card' + (allDone ? ' done' : '') + (activeExoIndex === i ? ' active' : '');

      const head = document.createElement('div');
      head.className = 'exo-head';

      const nameWrap = document.createElement('div');
      const name = document.createElement('p');
      name.className = 'exo-name';
      name.contentEditable = 'true';
      name.textContent = exo.name;
      name.addEventListener('blur', () => { exo.name = name.textContent.trim() || 'Exercice'; });
      const meta = document.createElement('div');
      meta.className = 'exo-meta';
      meta.textContent = exo.sets + ' séries × ' + exo.reps + ' reps · repos ' + exo.rest + ' sec';
      nameWrap.appendChild(name);
      nameWrap.appendChild(meta);

      const delBtn = document.createElement('button');
      delBtn.className = 'del-btn';
      delBtn.innerHTML = '&times;';
      delBtn.title = 'Supprimer';
      delBtn.addEventListener('click', () => {
        exercises.splice(i, 1);
        render();
      });

      head.appendChild(nameWrap);
      head.appendChild(delBtn);
      card.appendChild(head);

      // set dots
      const setRow = document.createElement('div');
      setRow.className = 'set-row';
      const pill = document.createElement('div');
      pill.className = 'set-pill';
      for (let s = 0; s < exo.sets; s++){
        const dot = document.createElement('div');
        dot.className = 'set-dot' + (exo.checked[s] ? ' checked' : '');
        dot.textContent = (s+1);
        dot.addEventListener('click', () => {
          const wasChecked = !!exo.checked[s];
          exo.checked[s] = !wasChecked;
          render();
          if (!wasChecked){
            // just checked a set -> launch rest, unless it's the very last set of last exercise
            const isLastSetOfExo = (s === exo.sets - 1);
            const stillMoreSets = exo.checked.filter(Boolean).length < exo.sets;
            startRest(exo, i);
          }
        });
        pill.appendChild(dot);
      }
      setRow.appendChild(pill);
      card.appendChild(setRow);

      // editable params
      const params = document.createElement('div');
      params.className = 'params';
      params.innerHTML = paramHTML('Séries', exo.sets, 'sets') +
                          paramHTML('Reps', exo.reps, 'reps') +
                          paramHTML('Repos (s)', exo.rest, 'rest');
      card.appendChild(params);

      params.querySelectorAll('input').forEach(input => {
        input.addEventListener('change', () => {
          const field = input.dataset.field;
          let val = parseInt(input.value, 10);
          if (isNaN(val) || val < 0) val = 0;
          exo[field] = val;
          if (field === 'sets'){
            const newChecked = [];
            for (let k=0;k<val;k++) newChecked.push(exo.checked[k] || false);
            exo.checked = newChecked;
          }
          render();
        });
      });

      // lien vidéo
      const videoRow = document.createElement('div');
      videoRow.className = 'video-row';

      const videoInput = document.createElement('input');
      videoInput.type = 'url';
      videoInput.placeholder = 'Coller un lien vidéo (YouTube, etc.)';
      videoInput.value = exo.video || '';
      videoInput.addEventListener('change', () => {
        exo.video = videoInput.value.trim();
        render();
      });
      videoRow.appendChild(videoInput);

      if (exo.video){
        const link = document.createElement('a');
        link.className = 'video-link';
        link.href = exo.video;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = '▶ Voir';
        videoRow.appendChild(link);
      }
      card.appendChild(videoRow);

      // manual rest launch
      const startBtn = document.createElement('button');
      startBtn.className = 'start-rest';
      startBtn.textContent = '⏱ Lancer le repos (' + exo.rest + ' sec)';
      startBtn.addEventListener('click', () => startRest(exo, i));
      card.appendChild(startBtn);

      exoList.appendChild(card);
    });

    const total = totalSets();
    const done = doneSets();
    progressFill.style.width = total > 0 ? Math.round((done/total)*100) + '%' : '0%';
    progressLabel.textContent = done + ' / ' + total + ' séries';

    if (total > 0 && done === total){
      doneBanner.innerHTML = '<div class="done-banner">💪 Séance terminée, bravo !</div><div class="reset-link" id="resetLink">Recommencer la séance</div>';
      document.getElementById('resetLink').addEventListener('click', resetAll);
    } else {
      doneBanner.innerHTML = '';
    }
  }

  function paramHTML(label, value, field){
    return '<div class="param"><label>'+label+'</label><input type="number" inputmode="numeric" data-field="'+field+'" value="'+value+'"></div>';
  }

  function resetAll(){
    exercises.forEach(e => { e.checked = new Array(e.sets).fill(false); });
    render();
  }

  function startRest(exo, i){
    activeExoIndex = i;
    clearInterval(timerInterval);
    timeLeft = exo.rest;
    totalTime = exo.rest;
    restExoName.textContent = exo.name;
    overlay.classList.add('show');
    updateRing();
    timerInterval = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0){
        clearInterval(timerInterval);
        timeLeft = 0;
        updateRing();
        if (navigator.vibrate) navigator.vibrate([200,100,200]);
        setTimeout(closeOverlay, 500);
        return;
      }
      updateRing();
    }, 1000);
  }

  function updateRing(){
    const mm = String(Math.floor(timeLeft/60)).padStart(2,'0');
    const ss = String(timeLeft%60).padStart(2,'0');
    ringTime.textContent = mm+':'+ss;
    const ratio = totalTime > 0 ? timeLeft/totalTime : 0;
    ringFg.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);
  }

  function closeOverlay(){
    overlay.classList.remove('show');
    clearInterval(timerInterval);
    activeExoIndex = null;
    render();
  }

  document.getElementById('skipRestBtn').addEventListener('click', closeOverlay);
  document.getElementById('addTimeBtn').addEventListener('click', () => {
    timeLeft += 15;
    totalTime += 15;
    updateRing();
  });

  document.getElementById('addExoBtn').addEventListener('click', () => {
    exercises.push({ name: 'Nouvel exercice', sets: 3, reps: 12, rest: 45, checked: [], video: '' });
    render();
  });

  document.getElementById('clearProgressBtn').addEventListener('click', () => {
    resetAll();
  });

  // ---- Décompte libre (indépendant de la séance) ----
  const freeOverlay = document.getElementById('freeOverlay');
  const freeSetupView = document.getElementById('freeSetupView');
  const freeRunView = document.getElementById('freeRunView');
  const freeMinInput = document.getElementById('freeMin');
  const freeSecInput = document.getElementById('freeSec');
  const freeRingFg = document.getElementById('freeRingFg');
  const freeRingTime = document.getElementById('freeRingTime');

  let freeInterval = null;
  let freeTimeLeft = 0;
  let freeTotalTime = 0;
  let freePaused = false;

  document.getElementById('freeTimerBtn').addEventListener('click', () => {
    freeSetupView.style.display = 'block';
    freeRunView.style.display = 'none';
    freeOverlay.classList.add('show');
  });

  document.getElementById('closeFreeSetup').addEventListener('click', () => {
    clearInterval(freeInterval);
    freeOverlay.classList.remove('show');
  });

  document.querySelectorAll('.quick-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const sec = parseInt(chip.dataset.sec, 10);
      freeMinInput.value = Math.floor(sec/60);
      freeSecInput.value = sec % 60;
    });
  });

  document.getElementById('startFreeBtn').addEventListener('click', () => {
    const mins = parseInt(freeMinInput.value, 10) || 0;
    const secs = parseInt(freeSecInput.value, 10) || 0;
    const total = mins*60 + secs;
    if (total <= 0) return;
    freeTimeLeft = total;
    freeTotalTime = total;
    freePaused = false;
    freeSetupView.style.display = 'none';
    freeRunView.style.display = 'flex';
    updateFreeRing();
    startFreeInterval();
  });

  function startFreeInterval(){
    clearInterval(freeInterval);
    freeInterval = setInterval(() => {
      if (freePaused) return;
      freeTimeLeft--;
      if (freeTimeLeft <= 0){
        clearInterval(freeInterval);
        freeTimeLeft = 0;
        updateFreeRing();
        if (navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
        setTimeout(() => {
          freeOverlay.classList.remove('show');
        }, 700);
        return;
      }
      updateFreeRing();
    }, 1000);
  }

  function updateFreeRing(){
    const mm = String(Math.floor(freeTimeLeft/60)).padStart(2,'0');
    const ss = String(freeTimeLeft%60).padStart(2,'0');
    freeRingTime.textContent = mm+':'+ss;
    const ratio = freeTotalTime > 0 ? freeTimeLeft/freeTotalTime : 0;
    freeRingFg.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);
  }

  document.getElementById('freePauseBtn').addEventListener('click', (e) => {
    freePaused = !freePaused;
    e.target.textContent = freePaused ? 'Reprendre' : 'Pause';
  });

  document.getElementById('freeStopBtn').addEventListener('click', () => {
    clearInterval(freeInterval);
    freeOverlay.classList.remove('show');
  });

  // ---- Wake Lock : empêcher la mise en veille de l'écran ----
  let wakeLock = null;
  const wakeDot = document.getElementById('wakeDot');
  const wakeLabel = document.getElementById('wakeLabel');
  const wakeSupported = 'wakeLock' in navigator;

  async function requestWakeLock(){
    if (!wakeSupported) {
      wakeLabel.textContent = 'Écran : non supporté sur ce navigateur';
      return;
    }
    try{
      wakeLock = await navigator.wakeLock.request('screen');
      wakeDot.classList.add('active');
      wakeLabel.textContent = 'Écran : reste allumé pendant la séance';
      wakeLock.addEventListener('release', () => {
        wakeDot.classList.remove('active');
        wakeLabel.textContent = 'Écran : veille normale';
      });
    }catch(err){
      wakeDot.classList.remove('active');
      wakeLabel.textContent = 'Écran : veille normale';
    }
  }

  // Redemander le wake lock si l'onglet redevient visible (iOS le libère en arrière-plan)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && wakeSupported) {
      requestWakeLock();
    }
  });

  requestWakeLock();

  render();
})();
</script>
